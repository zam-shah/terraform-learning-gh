parameters:
  - name: workingDir
    type: string
  - name: backendKey
    type: string
  - name: serviceConnection
    type: string
  - name: artifactName
    type: string

steps:
  - task: TerraformInstaller@1
    displayName: 'Install Terraform'
    inputs:
      terraformVersion: '1.15.8'

  - script: |
      git config --global url."https://$(System.AccessToken)@dev.azure.com".insteadOf "https://zamhshah0763@dev.azure.com"
    displayName: 'Configure Git auth for module fetch'
    

  - task: TerraformTaskV4@4
    displayName: 'Terraform Init'
    inputs:
      provider: 'azurerm'
      command: 'init'
      workingDirectory: '${{ parameters.workingDir }}'
      backendServiceArm: '${{ parameters.serviceConnection }}'
      backendAzureRmResourceGroupName: 'rg-tfstate'
      backendAzureRmStorageAccountName: 'sttfstatezam0809'
      backendAzureRmContainerName: 'tfstate'
      backendAzureRmKey: '${{ parameters.backendKey }}'

  - task: TerraformTaskV4@4
    displayName: 'Terraform Apply'
    inputs:
      provider: 'azurerm'
      command: 'apply'
      workingDirectory: '${{ parameters.workingDir }}'
      environmentServiceNameAzureRM: '${{ parameters.serviceConnection }}'
      commandOptions: '-input=false -auto-approve $(Pipeline.Workspace)/${{ parameters.artifactName }}/tfplan'