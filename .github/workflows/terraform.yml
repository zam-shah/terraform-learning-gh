name: terraform-gh-dev

on:
  push:
    branches: [main]
    paths:
      - 'envs/gh-dev/**'
      - 'modules/**'
      - '.github/workflows/terraform.yml'
    
  pull_request:
    branches: [main]
    paths:
      - 'envs/gh-dev/**'
      - 'modules/**'
      - '.github/workflows/terraform.yml'  
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_USE_OIDC: true

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: envs/gh-dev
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check
      - run: terraform init
      - run: terraform validate
      - uses: terraform-linters/setup-tflint@v4
      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init --config=$GITHUB_WORKSPACE/.tflint.hcl
          tflint --config=$GITHUB_WORKSPACE/.tflint.hcl
      - name: Install Checkov
        run: |
          pip install checkov
          checkov --version
      - name: Checkov blocking
        run: checkov -d . --framework terraform --compact --check CKV_AZURE_3,CKV_AZURE_44,CKV_AZURE_59,CKV_AZURE_190,CKV2_AZURE_47,CKV2_AZURE_40    
      - name: Checkov advisory
        run: checkov -d . --framework terraform --compact --soft-fail         
      - run: terraform plan -out=tfplan
      - name: Encrypt plan
        env:
          TFPLAN_PASSPHRASE: ${{ secrets.TFPLAN_PASSPHRASE }}
        run: echo "$TFPLAN_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --symmetric --cipher-algo AES256 -o tfplan.gpg tfplan
      - uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: envs/gh-dev/tfplan.gpg
          retention-days: 1

  apply:
    needs: plan
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: gh-dev
    defaults:
      run:
        working-directory: envs/gh-dev
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init
      - uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: envs/gh-dev
      - name: Decrypt plan
        env:
          TFPLAN_PASSPHRASE: ${{ secrets.TFPLAN_PASSPHRASE }}
        run: echo "$TFPLAN_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 -o tfplan -d tfplan.gpg
      - run: terraform apply tfplan